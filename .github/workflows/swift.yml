name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # This repository is public, so it cannot run on the machines we own: anyone may open a pull
    # request, and a self-hosted runner would execute it. Standard GitHub-hosted runners are free
    # for public repositories, so there is nothing to weigh.
    runs-on: macos-latest

    steps:
    # v4 runs on Node 20, which the runners no longer provide and now force onto Node 24 with a
    # deprecation notice on every run. v5 is the first major that declares node24 itself.
    - uses: actions/checkout@v5

    # There is no test step, and no test target. A change here is proven by building the example
    # app against the deployed development server and walking it. See
    # Different-Productions/DifferentRequests-Server#144.
    - name: Build
      run: swift build -v
