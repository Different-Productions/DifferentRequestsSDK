name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    # v4 runs on Node 20, which the runners no longer provide and now force onto Node 24 with a
    # deprecation notice on every run. v5 is the first major that declares node24 itself.
    - uses: actions/checkout@v5

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v
