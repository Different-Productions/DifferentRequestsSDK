name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # This repository is public, so it cannot run on the machines we own: anyone may open a pull
    # request, and a self-hosted runner would execute it. Standard GitHub-hosted runners are free
    # for public repositories, so there is nothing to weigh.
    runs-on: macos-latest

    steps:
    # v4 runs on Node 20, which the runners no longer provide and now force onto Node 24 with a
    # deprecation notice on every run. v5 is the first major that declares node24 itself.
    - uses: actions/checkout@v5

    - name: Fail if the contract pin is behind its latest release
      run: |
        set -euo pipefail
        # This SDK and the server must speak the same contract. They agree only if each one
        # pins the newest published version, so that is what is checked — the contract's own
        # tags are the single source of truth, and neither repo has to read the other's
        # Package.swift across a permission boundary to know it has fallen behind.
        #
        # The SDK sat five releases behind this server for weeks and nothing said so. Every
        # change in the gap happened to be additive, so nothing broke; the next one would not
        # have announced itself either.
        PINNED="$(grep -A 3 'differentrequests-proto.git' Package.swift \
          | grep -oE 'exact: "[0-9]+\.[0-9]+\.[0-9]+"' \
          | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
          | head -1)"

        if [ -z "$PINNED" ]; then
          echo "::error::No 'exact:' contract pin found in Package.swift. The contract is pinned exactly on purpose — a range would let the wire move under a built client." >&2
          exit 1
        fi

        LATEST="$(git ls-remote --tags --refs \
          https://github.com/Different-Productions/differentrequests-proto.git \
          | awk -F/ '{print $NF}' \
          | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
          | sort -t. -k1,1n -k2,2n -k3,3n \
          | tail -1)"

        if [ -z "$LATEST" ]; then
          echo "::error::Could not read the contract's tags. This check needs them to know what current is." >&2
          exit 1
        fi

        echo "pinned: $PINNED    latest published: $LATEST"

        if [ "$PINNED" != "$LATEST" ]; then
          echo "::error::This SDK pins contract $PINNED, but $LATEST is published. Both this server and the SDK must pin the same version or they can disagree about field numbers. Bump the pin, or unpublish the release." >&2
          exit 1
        fi

    # There is no test step, and no test target. A change here is proven by building the example
    # app against the deployed development server and walking it. See
    # Different-Productions/DifferentRequests-Server#144.
    - name: Build
      run: swift build -v
